apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mem0.fullname" . }}-api
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "mem0.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "mem0.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until nc -z {{ include "mem0.postgresServiceName" . }} {{ .Values.postgres.service.port }};
              do echo waiting for postgres; sleep 2; done
      {{- end }}
      containers:
        - name: mem0-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: POSTGRES_HOST
              value: {{ include "mem0.postgresServiceName" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.service.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mem0.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_COLLECTION_NAME
              value: memories
            - name: APP_DB_NAME
              value: mem0_app
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mem0.secretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mem0.secretName" . }}
                  key: JWT_SECRET
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mem0.secretName" . }}
                  key: ADMIN_API_KEY
                  optional: true
            - name: AUTH_DISABLED
              value: {{ .Values.api.authDisabled | quote }}
            - name: DASHBOARD_URL
              value: {{ .Values.api.dashboardUrl | quote }}
            - name: MEM0_DEFAULT_LLM_MODEL
              value: {{ .Values.api.defaultLlmModel | quote }}
            - name: MEM0_DEFAULT_EMBEDDER_MODEL
              value: {{ .Values.api.defaultEmbedderModel | quote }}
            - name: MEM0_TELEMETRY
              value: {{ .Values.api.telemetry | quote }}
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
