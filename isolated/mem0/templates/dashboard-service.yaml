{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mem0.fullname" . }}-dashboard
  labels:
    {{- include "mem0.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  ports:
    - name: http
      port: {{ .Values.dashboard.port }}
      targetPort: http
  selector:
    {{- include "mem0.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
{{- end }}
